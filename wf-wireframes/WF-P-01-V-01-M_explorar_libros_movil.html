<script>
// Datos ficticios de wireframe. La geolocalización no se simula: sin coordenadas no se muestra distancia ni se limita el radio.
const originals=[{title:'Cien años de soledad',author:'Gabriel García Márquez',publisher:'Sudamericana',price:12,sale:true,city:'Las Palmas de Gran Canaria'},{title:'La sombra del viento',author:'Carlos Ruiz Zafón',publisher:'Planeta',price:8,sale:true,city:'Telde'},{title:'El principito',author:'Antoine de Saint-Exupéry',publisher:'Salamandra',sale:false,city:'Santa Cruz de Tenerife'},{title:'1984',author:'George Orwell',publisher:'Debolsillo',price:9,sale:true,city:'Vecindario'},{title:'Don Quijote de la Mancha',author:'Miguel de Cervantes',publisher:'Cátedra',sale:false,city:'Arucas'},{title:'La casa de los espíritus',author:'Isabel Allende',publisher:'Plaza & Janés',price:7,sale:true,city:'La Laguna'},{title:'Rayuela',author:'Julio Cortázar',publisher:'Alfaguara',sale:false,city:'Teror'},{title:'Fahrenheit 451',author:'Ray Bradbury',publisher:'Minotauro',price:6,sale:true,city:'Arrecife'},{title:'Orgullo y prejuicio',author:'Jane Austen',publisher:'Austral',price:10,sale:true,city:'Gáldar'},{title:'La tregua',author:'Mario Benedetti',publisher:'Alianza',price:5,sale:true,city:'La Orotava'},{title:'Ensayo sobre la ceguera',author:'José Saramago',publisher:'Alfaguara',sale:false,city:'Maspalomas'},{title:'El nombre de la rosa',author:'Umberto Eco',publisher:'Lumen',price:11,sale:true,city:'Agüimes'}];
const data=originals.map((x,i)=>({...x,date:originals.length-i,condition:i%3===0?'Como nuevo':i%3===1?'Buen estado':'Usado'}));let shown=8,matching=[];
for(const id of ['author','publisher']){const sel=document.getElementById(id);for(const value of [...new Set(data.map(x=>x[id]))].sort()){let o=document.createElement('option');o.value=value;o.textContent=value;sel.append(o)}}
function closeFilters(){document.getElementById('filter-panel').hidden=true;document.querySelectorAll('[aria-controls="filter-panel"]').forEach(b=>b.setAttribute('aria-expanded','false'))}
function toggleFilters(){const p=document.getElementById('filter-panel');p.hidden=!p.hidden;document.querySelectorAll('[aria-controls="filter-panel"]').forEach(b=>b.setAttribute('aria-expanded',String(!p.hidden)))}
function closeAndApply(){shown=8;closeFilters();apply()}
function resetFilters(){for(const id of ['q','postal'])document.getElementById(id).value='';for(const id of ['author','publisher','status','sort'])document.getElementById(id).selectedIndex=0;document.getElementById('distance').value='50';shown=8;closeAndApply()}
function loadMore(){shown+=8;render()}
function openBook(){alert('Destino previsto: P-02 · Detalle de ejemplar (aún no desarrollado).')}
function apply(){const val=id=>document.getElementById(id).value, q=val('q').trim().toLocaleLowerCase('es'),author=val('author'),publisher=val('publisher'),status=val('status'),sort=val('sort'),radius=val('distance'),postal=val('postal').trim();const hasPostal=/^\d{5}$/.test(postal);
document.getElementById('sort-label').textContent=({new:'Novedad',near:'Proximidad',low:'Precio ↑',high:'Precio ↓'}[sort]);
const activeCount=[!!author,!!publisher,status!=='all',radius!=='50',!!postal].filter(Boolean).length;const counter=document.getElementById('filter-count');counter.hidden=!activeCount;counter.textContent=activeCount;
const locationActive=hasPostal&&radius!=='all';
const context=document.getElementById('context');if(locationActive)context.textContent='Ubicación indicada: '+postal+'. La geolocalización y el filtro de '+radius+' km no se ejecutan en este wireframe; se muestran resultados de ejemplo por ciudad.';else if(sort==='near')context.textContent='La ordenación por proximidad requiere datos geográficos. En este wireframe se mantiene el orden por novedad.';else if(radius==='all')context.textContent='Exploración sin límite de distancia; ubicación mostrada por ciudad.';else context.textContent='';context.hidden=!context.textContent;
matching=data.filter(x=>(!q||(x.title+' '+x.author+' '+x.publisher).toLocaleLowerCase('es').includes(q))&&(!author||x.author===author)&&(!publisher||x.publisher===publisher)&&(status==='all'||(status==='sale'?x.sale:!x.sale)));
if(sort==='low')matching.sort((a,b)=>(a.price??Infinity)-(b.price??Infinity));else if(sort==='high')matching.sort((a,b)=>(b.price??-Infinity)-(a.price??-Infinity));else matching.sort((a,b)=>b.date-a.date);render();}
function render(){
  const rows=matching.slice(0,shown);
  document.getElementById('count').textContent=matching.length+' ejemplares encontrados';
  document.getElementById('empty').style.display=matching.length?'none':'block';
  document.getElementById('cards').innerHTML=rows.map(x=>`<article class="card" tabindex="0" role="link" onclick="openBook()" onkeydown="if(event.target===this && (event.key==='Enter'||event.key===' ')){event.preventDefault();openBook()}" aria-label="Ver detalle de ${x.title} de ${x.author}">

    <div class="card-bottom"><div class="book-detail"><span class="book-condition">${x.condition}</span><span class="book-separator" aria-hidden="true">·</span><span class="book-location" title="${x.city}">${x.city}</span></div>
    <div class="book-commercial">${x.sale?`<strong class="amount">${x.price} €</strong>`:'<span class="offer-text">Hacer oferta</span>'}</div></div>
  </article>`).join('');
  document.getElementById('load-more').hidden=shown>=matching.length;
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeFilters()});document.addEventListener('click',e=>{if(!e.target.closest('.filter-panel')&&!e.target.closest('.filter-toolbar'))closeFilters()});apply();
</script></body></html>
