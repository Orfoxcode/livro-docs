const books=[['Cien años de soledad','Gabriel García Márquez'],['La sombra del viento','Carlos Ruiz Zafón'],['El principito','Antoine de Saint-Exupéry'],['1984','George Orwell'],['La casa de los espíritus','Isabel Allende'],['Rayuela','Julio Cortázar'],['Fahrenheit 451','Ray Bradbury'],['Orgullo y prejuicio','Jane Austen'],['El nombre de la rosa','Umberto Eco'],['La tregua','Mario Benedetti']];
function markCenter(el){const r=el.getBoundingClientRect(),center=r.left+r.width/2;let best=null,distance=Infinity;for(const cover of el.children){const b=cover.getBoundingClientRect(),d=Math.abs(b.left+b.width/2-center);if(d<distance){distance=d;best=cover}}for(const cover of el.children)cover.classList.toggle('is-center',cover===best);const buttons=el.closest('.carousel-area').querySelectorAll('.carousel-controls button');buttons[0].disabled=el.scrollLeft<=1;buttons[1].disabled=el.scrollLeft>=el.scrollWidth-el.clientWidth-1}
function moveBooks(button,direction){const el=button.closest('.carousel-area').querySelector('.book-carousel');const step=el.children[1].offsetLeft-el.children[0].offsetLeft;el.scrollBy({left:direction*step,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'})}
function initCarousels(){document.querySelectorAll('.book-carousel').forEach(el=>{el.addEventListener('scroll',()=>markCenter(el),{passive:true});
let wheelTotal=0,lastWheel=0;
el.closest('.carousel-area').addEventListener('wheel',e=>{
  if(e.ctrlKey||Math.abs(e.deltaX)>Math.abs(e.deltaY)||!e.deltaY)return;
  const direction=Math.sign(e.deltaY),max=el.scrollWidth-el.clientWidth;
  if(max<=1||(direction<0&&el.scrollLeft<=1)||(direction>0&&el.scrollLeft>=max-1))return;
  e.preventDefault();
  const now=performance.now();
  if(now-lastWheel>180||Math.sign(wheelTotal)!==direction)wheelTotal=0;
  wheelTotal+=e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?el.clientWidth:1);
  if(Math.abs(wheelTotal)>=24&&now-lastWheel>140){
    const step=el.children[1].offsetLeft-el.children[0].offsetLeft;
    const index=Math.round(el.scrollLeft/step);
    el.scrollTo({left:(index+direction)*step,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});
    wheelTotal=0;lastWheel=now;
  }
},{passive:false});el.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const step=el.children[1].offsetLeft-el.children[0].offsetLeft;el.scrollBy({left:(e.key==='ArrowRight'?1:-1)*step,behavior:'smooth'})}});requestAnimationFrame(()=>{const step=el.children[1].offsetLeft-el.children[0].offsetLeft;const query=normalize($('q').value.trim());const found=query?Array.from(el.children).findIndex(cover=>normalize(cover.querySelector('strong').textContent).includes(query)):-1;el.scrollLeft=step*(found>=0?found:1);markCenter(el)})})}
window.addEventListener('resize',()=>document.querySelectorAll('.book-carousel').forEach(markCenter));

const data=[['Marta Pérez','Las Palmas de Gran Canaria',34],['Daniel Suárez','Telde',18],['Lucía Martín','Vecindario',56],['Pablo Rodríguez','Arucas',12],['Elena García','Santa Cruz de Tenerife',27],['Javier Hernández','La Laguna',41],['Sara Díaz','Teror',23],['Andrés Romero','Arrecife',16],['Ana Torres','Gáldar',39],['David Santana','Agüimes',21],['Clara Medina','Maspalomas',15],['Raúl Vega','La Orotava',32]].map(([name,city,count],i)=>({id:i,name,city,count,sale:i%4===3?0:Math.max(1,Math.floor(count*.16))}));
const normalize=text=>text.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('es');
function libraryBooks(x){return Array.from({length:6},(_,j)=>({title:books[(x.id+j)%books.length][0],author:books[(x.id+j)%books.length][1],price:j<Math.min(x.sale,4)?5+(x.id+j*3)%14:null}))}
let shown=8,matching=data; const $=id=>document.getElementById(id);let locationMessage='';
function notice(title,message){$('dialog-title').textContent=title;$('dialog-text').textContent=message;$('dialog').showModal()}
function closePops(){document.querySelectorAll('.pop').forEach(p=>p.hidden=true);document.querySelectorAll('[aria-controls]').forEach(b=>b.setAttribute('aria-expanded','false'))}
function togglePop(id){const was=$('pop-'+id).hidden;closePops();$('pop-'+id).hidden=!was;$(id+'-pill').setAttribute('aria-expanded',String(was))}
function applyLocation(){const postal=$('postal');postal.setCustomValidity(postal.value&&!/^\d{5}$/.test(postal.value)?'Introduce un código postal de cinco dígitos.':'');if(!postal.reportValidity())return;const radius=$('distance').value;locationMessage=postal.value?'Ubicación de referencia: '+postal.value+'. El cálculo de distancias no se ejecuta en este wireframe; se muestran bibliotecas de ejemplo.':'';$('distance-pill').textContent='⌖ Proximidad: '+(radius==='all'?'sin límite':postal.value?radius+' km':'sin ubicación')+' ▾';closePops();apply()}
$('postal').addEventListener('input',()=> $('postal').setCustomValidity(''));
function apply(){shown=8;const query=normalize($('q').value.trim());matching=data.filter(x=>(normalize(x.name).includes(query)||libraryBooks(x).some(b=>normalize(b.title).includes(query))));const sort=$('sort').value;if(sort==='name')matching.sort((a,b)=>a.name.localeCompare(b.name,'es'));$('sort-pill').textContent=({new:'Novedad',near:'Proximidad',name:'Nombre: A–Z'}[sort])+' ▾';$('context').textContent=sort==='near'?'La proximidad requiere datos geográficos. En este wireframe se mantiene el orden por novedad.':locationMessage;$('context').hidden=!$('context').textContent;$('reset').hidden=!(query||$('postal').value||sort!=='new'||$('distance').value!=='50');render()}
function render(){$('count').textContent=matching.length+' bibliotecas encontradas';$('empty').style.display=matching.length?'none':'block';$('cards').innerHTML=matching.slice(0,shown).map(x=>`<article class="card library-card" tabindex="0" role="link" aria-label="Ver biblioteca de ${x.name}" onclick="if(!event.target.closest('.carousel-area'))openLibrary(${x.id})" onkeydown="if(event.target===this &amp;&amp; event.key==='Enter'){event.preventDefault();openLibrary(${x.id})}"><div class="carousel-area"><div class="book-carousel" tabindex="0" role="region" aria-label="Libros de ${x.name}. Usa la rueda del ratón o las flechas izquierda y derecha para desplazarte.">${libraryBooks(x).map(book=>{return `<div class="mini-cover" role="img" aria-label="${book.title}, ${book.author}${book.price!==null?", "+book.price+" euros":""}">${book.price!==null?`<span class="book-price">${book.price} €</span>`:""}<span class="cover-line"></span><strong>${book.title}</strong><span>${book.author}</span><span class="cover-line"></span></div>`}).join('')}</div><div class="carousel-controls"><button aria-label="Libros anteriores" onclick="moveBooks(this,-1)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button><button aria-label="Más libros" onclick="moveBooks(this,1)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button></div></div><div class="reader"><span class="avatar" aria-hidden="true">${x.name.split(' ').map(w=>w[0]).join('')}</span><div><h2>${x.name}</h2><p>⌖ ${x.city}</p></div></div><div class="library-count"><strong>${x.count}</strong> libros <span class="count-divider">·</span> <strong>${x.sale}</strong> en venta</div></article>`).join('');$('more').hidden=shown>=matching.length;initCarousels()}
function openLibrary(id){const x=data.find(x=>x.id===id);notice('Biblioteca de '+x.name,'Destino previsto: P-03 · Biblioteca y perfil público. Aquí se consultarían sus '+x.count+' ejemplares públicos. Pantalla pendiente de diseñar.')}
function resetFilters(){$('q').value='';$('postal').value='';$('postal').setCustomValidity('');$('distance').value='50';$('sort').value='new';locationMessage='';$('distance-pill').textContent='⌖ Proximidad ▾';closePops();apply()}
$('search').addEventListener('submit',e=>{e.preventDefault();apply()});document.addEventListener('click',e=>{if(!e.target.closest('.filter'))closePops()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closePops()});apply();
</script></body></html>
