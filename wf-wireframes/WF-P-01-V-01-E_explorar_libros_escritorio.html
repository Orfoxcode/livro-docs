<script>
// Datos ficticios de wireframe. La geolocalización no se simula: sin coordenadas no se muestra distancia ni se limita el radio.
const originals=[{title:'Cien años de soledad',author:'Gabriel García Márquez',publisher:'Sudamericana',price:12,sale:true,city:'Las Palmas de Gran Canaria'},{title:'La sombra del viento',author:'Carlos Ruiz Zafón',publisher:'Planeta',price:8,sale:true,city:'Telde'},{title:'El principito',author:'Antoine de Saint-Exupéry',publisher:'Salamandra',sale:false,city:'Santa Cruz de Tenerife'},{title:'1984',author:'George Orwell',publisher:'Debolsillo',price:9,sale:true,city:'Vecindario'},{title:'Don Quijote de la Mancha',author:'Miguel de Cervantes',publisher:'Cátedra',sale:false,city:'Arucas'},{title:'La casa de los espíritus',author:'Isabel Allende',publisher:'Plaza & Janés',price:7,sale:true,city:'La Laguna'},{title:'Rayuela',author:'Julio Cortázar',publisher:'Alfaguara',sale:false,city:'Teror'},{title:'Fahrenheit 451',author:'Ray Bradbury',publisher:'Minotauro',price:6,sale:true,city:'Arrecife'},{title:'Orgullo y prejuicio',author:'Jane Austen',publisher:'Austral',price:10,sale:true,city:'Gáldar'},{title:'La tregua',author:'Mario Benedetti',publisher:'Alianza',price:5,sale:true,city:'La Orotava'},{title:'Ensayo sobre la ceguera',author:'José Saramago',publisher:'Alfaguara',sale:false,city:'Maspalomas'},{title:'El nombre de la rosa',author:'Umberto Eco',publisher:'Lumen',price:11,sale:true,city:'Agüimes'}];
// Cantidad ficticia de ejemplares por libro para visualización de tarjetas.
const sampleOwners=[18,12,7,25,9,15,6,11,8,5,14,10];
const data=originals.map((x,i)=>({...x,date:originals.length-i,condition:i%3===0?'Como nuevo':i%3===1?'Buen estado':'Usado',isbn:'Pendiente de verificar',owners:sampleOwners[i]}));let shown=8,matching=[];
for(const id of ['author','publisher']){const sel=document.getElementById(id);for(const value of [...new Set(data.map(x=>x[id]))].sort()){let o=document.createElement('option');o.value=value;o.textContent=value;sel.append(o)}}
function closeFilters(){document.getElementById('filter-panel').hidden=true;document.getElementById('filters-trigger').setAttribute('aria-expanded','false')}
function toggleFilters(){const p=document.getElementById('filter-panel');p.hidden=!p.hidden;document.getElementById('filters-trigger').setAttribute('aria-expanded',String(!p.hidden))}
function closeAndApply(){shown=8;apply()}
function resetFilters(){for(const id of ['author','publisher'])document.getElementById(id).selectedIndex=0;document.getElementById('distance').value='all';shown=8;apply()}
function loadMore(){shown+=8;render()}
const savedBooks=new Set();const viewedBooks=[];let activeBook=null;
function openBook(i){activeBook=data[i];if(!activeBook)return;const previous=viewedBooks.indexOf(i);if(previous!==-1)viewedBooks.splice(previous,1);viewedBooks.unshift(i);const x=activeBook;document.getElementById('detail-content').innerHTML=`<div class="detail-intro"><div class="detail-cover">CUBIERTA<br>DEL LIBRO</div><div><h2 id="detail-title">${x.title}</h2><p class="detail-author">${x.author}</p><p class="detail-publisher">Editorial: ${x.publisher}</p><span class="detail-availability">${x.sale?'Anunciado para venta':'Sin anuncio de venta'}</span></div></div><div class="detail-info"><div><small>Estado</small><strong>${x.condition}</strong></div><div><small>Localidad</small><strong>${x.city}</strong></div></div><div class="detail-price">${x.sale?`<small>Precio anunciado</small><strong>${x.price} €</strong>`:`<strong>¿Te interesa este libro?</strong><p>Forma parte de una biblioteca personal, pero su propietario no lo ha anunciado para vender. Puedes proponerle una oferta; no implica que acepte.</p>`}</div><div class="detail-actions"><button type="button" class="save-action" onclick="toggleSaved(${data.indexOf(x)})">${savedBooks.has(data.indexOf(x))?'♥ Guardado':'♡ Guardar'}</button><button type="button" class="main-action" onclick="alert('Flujo de ${x.sale?'contacto sobre ejemplar anunciado':'propuesta de oferta'} pendiente de diseñar; este wireframe no envía solicitudes.')">${x.sale?'Contactar con propietario':'Hacer oferta'}</button></div>`;document.getElementById('detail-overlay').hidden=false;}
function closeDetail(){document.getElementById('detail-overlay').hidden=true;activeBook=null}
function toggleSaved(i){if(savedBooks.has(i))savedBooks.delete(i);else savedBooks.add(i);if(activeBook)openBook(i);}
function showSaved(){document.getElementById('saved-overlay').hidden=false;document.getElementById('saved-content').innerHTML=savedBooks.size?[...savedBooks].map(i=>`<button class="saved-item" type="button" onclick="closeSaved();openBook(${i})"><strong>${data[i].title}</strong><span>${data[i].author}</span></button>`).join(''):'<p>Aún no has guardado ningún ejemplar. Puedes hacerlo desde su detalle.</p>'}
function closeSaved(){document.getElementById('saved-overlay').hidden=true}
function showHistory(){const overlay=document.getElementById('history-overlay');document.getElementById('history-content').innerHTML=viewedBooks.length?viewedBooks.map(i=>`<button class="saved-item" type="button" onclick="closeHistory();openBook(${i})"><strong>${data[i].title}</strong><span>${data[i].author} · ${data[i].city}</span></button>`).join(''):'<p>Todavía no has consultado ningún ejemplar. Los que abras aparecerán aquí durante esta sesión.</p>';overlay.hidden=false;}
function closeHistory(){document.getElementById('history-overlay').hidden=true}

function apply(){
 const val=id=>document.getElementById(id).value;
 const q=val('q').trim().toLocaleLowerCase('es'),author=val('author'),publisher=val('publisher'),sort=val('sort'),radius=val('distance');
 
 const activeCount=[!!author,!!publisher,radius!=='all'].filter(Boolean).length;
 const counter=document.getElementById('filter-count');counter.hidden=!activeCount;counter.textContent=activeCount;
 const context=document.getElementById('context');
 context.textContent=radius!=='all'?'El radio seleccionado se aplicará a la ubicación de los propietarios cuando haya coordenadas reales. Este wireframe no simula distancias.':'';
 context.hidden=!context.textContent;
 matching=data.filter(x=>(!q||(x.title+' '+x.author+' '+x.publisher+' '+x.isbn).toLocaleLowerCase('es').includes(q))&&(!author||x.author===author)&&(!publisher||x.publisher===publisher));
 if(sort==='popular')matching.sort((a,b)=>b.owners-a.owners);
 else if(sort==='az')matching.sort((a,b)=>a.title.localeCompare(b.title,'es'));
 else matching.sort((a,b)=>b.date-a.date);
 render();
}
function render(){
  const rows=matching.slice(0,shown);
  document.getElementById('count').textContent=matching.length+' libros encontrados';
  document.getElementById('empty').style.display=matching.length?'none':'block';
  document.getElementById('cards').innerHTML=rows.map(x=>`<article class="card" tabindex="0" role="link" onclick="openBook(${data.indexOf(x)})" onkeydown="if(event.target===this && (event.key==='Enter'||event.key===' ')){event.preventDefault();openBook(${data.indexOf(x)})}" aria-label="Ver detalle de ${x.title} de ${x.author}">
    <div class="cover-wrap"><div class="cover" role="img" aria-label="Cubierta de ejemplo">CUBIERTA<br>DEL LIBRO</div></div>
    <div class="card-description"><h3 class="booktitle">${x.title}</h3><p class="author">${x.author}</p></div>
    <div class="book-owners"><div class="owner-avatars" aria-hidden="true"><span class="owner-avatar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 19c.45-3.4 2.7-5.2 6.5-5.2s6.05 1.8 6.5 5.2"/></svg></span><span class="owner-avatar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 19c.45-3.4 2.7-5.2 6.5-5.2s6.05 1.8 6.5 5.2"/></svg></span><span class="owner-avatar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 19c.45-3.4 2.7-5.2 6.5-5.2s6.05 1.8 6.5 5.2"/></svg></span></div><span><strong>${x.owners}</strong> ejemplares</span></div>
  </article>`).join('');
  document.getElementById('load-more').hidden=shown>=matching.length;
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeFilters();closeDetail();closeSaved()}});document.addEventListener('click',e=>{if(!e.target.closest('.filter-left'))closeFilters()});apply();
</script></body></html>
