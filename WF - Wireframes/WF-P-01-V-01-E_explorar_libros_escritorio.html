<div class="pillbar">
<div class="filter"><button id="distance-pill" class="pill default" aria-expanded="false" aria-controls="pop-distance" onclick="togglePop('distance')">⌖ 50 km ▾</button><div class="pop" id="pop-distance" hidden><label for="distance">Radio de búsqueda</label><select id="distance"><option value="10">10 km</option><option value="25">25 km</option><option value="50" selected>50 km</option><option value="100">100 km</option><option value="all">Sin límite</option></select><label for="postal">Código postal de referencia</label><input id="postal" inputmode="numeric" maxlength="5" placeholder="Ej. 35110"><button class="apply" onclick="closeAndApply()">Aplicar</button></div></div>

<div class="filter"><button id="status-pill" class="pill" onclick="togglePop('status')">Disponibilidad ▾</button><div class="pop" id="pop-status" hidden><label for="status">Disponibilidad</label><select id="status"><option value="all">Todos los ejemplares</option><option value="sale">Con anuncio de venta</option><option value="no-sale">Sin anuncio</option></select><button class="apply" onclick="closeAndApply()">Aplicar</button></div></div>
<div class="filter"><button id="author-pill" class="pill" onclick="togglePop('author')">Autor ▾</button><div class="pop" id="pop-author" hidden><label for="author">Autor</label><select id="author"><option value="">Todos los autores</option></select><button class="apply" onclick="closeAndApply()">Aplicar</button></div></div>
<div class="filter"><button id="publisher-pill" class="pill" onclick="togglePop('publisher')">Editorial ▾</button><div class="pop" id="pop-publisher" hidden><label for="publisher">Editorial</label><select id="publisher"><option value="">Todas las editoriales</option></select><button class="apply" onclick="closeAndApply()">Aplicar</button></div></div>
<div class="filter sort-filter"><button id="sort-pill" class="pill default" onclick="togglePop('sort')">Novedad ▾</button><div class="pop" id="pop-sort" hidden><label for="sort">Ordenar resultados</label><select id="sort"><option value="new" selected>Novedad</option><option value="near">Proximidad</option><option value="low">Precio: menor a mayor</option><option value="high">Precio: mayor a menor</option></select><button class="apply" onclick="closeAndApply()">Aplicar</button></div></div><button class="reset" id="reset" hidden onclick="resetFilters()">Limpiar filtros</button></div>
<p class="context" id="context" aria-live="polite" hidden></p>

<script>
// Datos ficticios de wireframe. La geolocalización no se simula: sin coordenadas no se muestra distancia ni se limita el radio.
const originals=[{title:'Cien años de soledad',author:'Gabriel García Márquez',publisher:'Sudamericana',price:12,sale:true,city:'Las Palmas de Gran Canaria'},{title:'La sombra del viento',author:'Carlos Ruiz Zafón',publisher:'Planeta',price:8,sale:true,city:'Telde'},{title:'El principito',author:'Antoine de Saint-Exupéry',publisher:'Salamandra',sale:false,city:'Santa Cruz de Tenerife'},{title:'1984',author:'George Orwell',publisher:'Debolsillo',price:9,sale:true,city:'Vecindario'},{title:'Don Quijote de la Mancha',author:'Miguel de Cervantes',publisher:'Cátedra',sale:false,city:'Arucas'},{title:'La casa de los espíritus',author:'Isabel Allende',publisher:'Plaza & Janés',price:7,sale:true,city:'La Laguna'},{title:'Rayuela',author:'Julio Cortázar',publisher:'Alfaguara',sale:false,city:'Teror'},{title:'Fahrenheit 451',author:'Ray Bradbury',publisher:'Minotauro',price:6,sale:true,city:'Arrecife'},{title:'Orgullo y prejuicio',author:'Jane Austen',publisher:'Austral',price:10,sale:true,city:'Gáldar'},{title:'La tregua',author:'Mario Benedetti',publisher:'Alianza',price:5,sale:true,city:'La Orotava'},{title:'Ensayo sobre la ceguera',author:'José Saramago',publisher:'Alfaguara',sale:false,city:'Maspalomas'},{title:'El nombre de la rosa',author:'Umberto Eco',publisher:'Lumen',price:11,sale:true,city:'Agüimes'}];
const data=originals.map((x,i)=>({...x,date:originals.length-i}));let shown=8,matching=[];
for(const id of ['author','publisher']){const sel=document.getElementById(id);for(const value of [...new Set(data.map(x=>x[id]))].sort()){let o=document.createElement('option');o.value=value;o.textContent=value;sel.append(o)}}
function togglePop(name){document.querySelectorAll('.pop').forEach(el=>el.hidden=el.id==='pop-'+name?!el.hidden:true);document.querySelectorAll('.pill[aria-controls]').forEach(b=>b.setAttribute('aria-expanded',String(!document.getElementById(b.getAttribute('aria-controls')).hidden)))}
function openLocation(){const popup=document.getElementById('pop-distance');document.querySelectorAll('.pop').forEach(x=>x.hidden=true);popup.hidden=false;document.getElementById('distance-pill').setAttribute('aria-expanded','true');document.getElementById('postal').focus()}
function closeAndApply(){document.querySelectorAll('.pop').forEach(x=>x.hidden=true);document.getElementById('distance-pill').setAttribute('aria-expanded','false');apply()}
function resetFilters(){for(const id of ['q','postal'])document.getElementById(id).value='';for(const id of ['author','publisher','status','sort'])document.getElementById(id).selectedIndex=0;document.getElementById('distance').value='50';shown=8;closeAndApply()}
function loadMore(){shown+=8;render()}
function openBook(){alert('Destino previsto: P-02 · Detalle de ejemplar (aún no desarrollado).')}
function apply(){const val=id=>document.getElementById(id).value, q=val('q').trim().toLocaleLowerCase('es'),author=val('author'),publisher=val('publisher'),status=val('status'),sort=val('sort'),radius=val('distance'),postal=val('postal').trim();const hasPostal=/^\d{5}$/.test(postal);document.getElementById('distance-pill').textContent='⌖ '+(radius==='all'?'Sin límite':radius+' km')+' ▾';document.getElementById('sort-pill').textContent=({new:'Novedad',near:'Proximidad',low:'Precio ↑',high:'Precio ↓'}[sort])+' ▾';
for(const [id,chosen,base] of [['author',author,'Autor'],['publisher',publisher,'Editorial'],['status',status==='all'?'':status,'Disponibilidad']]){const b=document.getElementById(id+'-pill');b.textContent=(chosen?(id==='status'?(chosen==='sale'?'Con anuncio':'Sin anuncio'):base+': '+chosen):base)+' ▾';b.classList.toggle('toggled',!!chosen)}
let filtersChanged=Boolean(q||author||publisher||status!=='all'||sort!=='new'||radius!=='50'||postal);document.getElementById('reset').hidden=!filtersChanged;
const locationActive=hasPostal&&radius!=='all';
const context=document.getElementById('context');if(locationActive)context.textContent='Ubicación indicada: '+postal+'. La geolocalización y el filtro de '+radius+' km no se ejecutan en este wireframe; se muestran resultados de ejemplo por ciudad.';else if(sort==='near')context.textContent='La ordenación por proximidad requiere datos geográficos. En este wireframe se mantiene el orden por novedad.';else if(radius==='all')context.textContent='Exploración sin límite de distancia; ubicación mostrada por ciudad.';else context.textContent='';
matching=data.filter(x=>(!q||(x.title+' '+x.author+' '+x.publisher).toLocaleLowerCase('es').includes(q))&&(!author||x.author===author)&&(!publisher||x.publisher===publisher)&&(status==='all'||(status==='sale'?x.sale:!x.sale)));
if(sort==='low')matching.sort((a,b)=>(a.price??Infinity)-(b.price??Infinity));else if(sort==='high')matching.sort((a,b)=>(b.price??-Infinity)-(a.price??-Infinity));else matching.sort((a,b)=>b.date-a.date);render();}
function openBuy(event){event.stopPropagation();alert('Acción prevista: iniciar la compra de este ejemplar anunciado. El flujo se diseñará en la pantalla correspondiente.');}
function openOffer(event){event.stopPropagation();alert('Acción prevista: iniciar una oferta por este ejemplar sin anuncio. El flujo se diseñará en la pantalla correspondiente.');}
function render(){const rows=matching.slice(0,shown);document.getElementById('count').textContent=matching.length+' ejemplares encontrados';document.getElementById('empty').style.display=matching.length?'none':'block';document.getElementById('cards').innerHTML=rows.map(x=>`<article class="card" tabindex="0" role="link" onclick="openBook()" onkeydown="if(event.key==='Enter')openBook()" aria-label="Ver detalle de ${x.title} de ${x.author}"><div class="cover-wrap"><div class="cover" role="img" aria-label="Marcador de posición de cubierta">CUBIERTA<br>DEL LIBRO</div></div><h3 class="booktitle">${x.title}</h3><p class="author">${x.author}</p><div class="card-bottom"><div class="card-meta">${x.sale?'<span class="amount">'+x.price+' €</span>':'<span class="no-ad">Sin anuncio</span>'}<span class="location" title="${x.city}">⌖ ${x.city}</span></div>${x.sale?'<button type="button" class="offer-button" onclick="openBuy(event)">Comprar</button>':'<button type="button" class="offer-button" onclick="openOffer(event)">Hacer una oferta</button>'}</div></article>`).join('');document.getElementById('load-more').hidden=shown>=matching.length;}

document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.pop').forEach(x=>x.hidden=true)});document.addEventListener('click',e=>{if(!e.target.closest('.filter'))document.querySelectorAll('.pop').forEach(x=>x.hidden=true)});apply();
</script></body></html>
